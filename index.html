<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>魔法學徒 - Vampire Survivors (手機縱向版)</title>
	<link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0f17;
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 900px;
            height: 1600px;
            transform-origin: center center;
        }

        canvas {
            display: block;
            background-color: #121520;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            width: 900px;
            height: 1600px;
        }

        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            z-index: 10;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-slate-950 overflow-hidden">

    <div id="game-container">
        <div class="scanlines"></div>

        <!-- HUD (簡化版：只留頂部時間分數與觸控提示，去除原本大型玩家狀態 UI) -->

            <!-- 頂部資訊：僅顯示時間與擊殺數 -->
            <div class="flex justify-between items-center w-full px-6 pt-4 font-mono font-bold text-lg text-slate-200 drop-shadow-md">
                <div class="bg-slate-900/80 px-4 py-1.5 rounded-full border border-slate-800">
                    ⏱️ <span id="timer-txt" class="text-amber-300">00:00 / 15:00</span>
                </div>
                <div class="bg-slate-900/80 px-4 py-1.5 rounded-full border border-slate-800">
                    💀 <span id="score-txt" class="text-cyan-300">0</span>
                </div>
            </div>

            <div id="boss-warning" class="hidden text-center self-center bg-red-950/90 border-2 border-red-500 text-red-100 px-6 py-2 rounded-lg font-black tracking-widest animate-pulse shadow-red-500/50 shadow-lg text-lg">
                ⚠ WARNING: 大紅 APPROACHING ⚠️
            </div>

        <!-- Level Up Modal -->
        <div id="upgrade-modal" class="hidden absolute inset-0 bg-slate-950/80 backdrop-blur-md z-30 flex flex-col items-center justify-center p-4 pointer-events-auto">
            
            <div style="transform: scale(1.75); transform-origin: center center; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 400px;">

                <p class="text-slate-400 text-[11px] mb-3">選擇一項技能或屬性升級：</p>

        </div>

        <!-- Main Menu Modal -->

            <div style="transform: scale(1.75); transform-origin: center center; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 440px;">
                
                <h1 id="menu-title" class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-amber-300 to-rose-500 mb-3 tracking-wider">
                    魔法學徒
                </h1>

                <!-- 技能設定區塊 -->

                    <h3 class="text-xs font-bold text-amber-400 uppercase tracking-widest mb-2 border-b border-slate-800 pb-1.5">

                <button id="start-btn" class="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold text-lg rounded-xl shadow-lg shadow-blue-500/30 transition transform active:scale-95 cursor-pointer">

                    回到首頁

            </div>
        </div>

        <canvas id="gameCanvas" width="900" height="1600"></canvas>
    </div>

    <script>
        class SoundEffects {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (AudioContextClass) this.ctx = new AudioContextClass();
                }
                if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
            }
            playShoot() {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.08);
                } catch(e) {}
            }
            playHit() {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.06);
                    gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.06);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.06);
                } catch(e) {}
            }
            playExplosion() {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(100, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(20, this.ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.2);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.2);
                } catch(e) {}
            }
            playWarning() {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, this.ctx.currentTime);
                    osc.frequency.setValueAtTime(440, this.ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.25);
                } catch(e) {}
            }
            playPowerup() {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(900, this.ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.3);
                } catch(e) {}
            }
        }

        // ==========================================
        // 通用物件池 (Object Pool) 實作
        // ==========================================
        class ObjectPool {
            constructor(createFn, resetFn, initialSize = 50) {
                this.createFn = createFn;
                this.resetFn = resetFn;
                this.pool = [];
                for (let i = 0; i < initialSize; i++) {
                    const obj = this.createFn();
                    obj._inPool = true;
                    this.pool.push(obj);
                }
            }

            get(...args) {
                let obj = this.pool.length > 0 ? this.pool.pop() : this.createFn();
                obj._inPool = false;
                this.resetFn(obj, ...args);
                return obj;
            }

            release(obj) {
                if (obj && !obj._inPool) {
                    obj._inPool = true;
                    this.pool.push(obj);
                }
            }
        }

        const audio = new SoundEffects();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const timerTxt = document.getElementById('timer-txt');
        const scoreTxt = document.getElementById('score-txt');
        const bossWarning = document.getElementById('boss-warning');
        const upgradeModal = document.getElementById('upgrade-modal');
        const upgradeCards = document.getElementById('upgrade-cards');
        const menuModal = document.getElementById('menu-modal');
        const hud = document.getElementById('hud');
        
        const gameoverModal = document.getElementById('gameover-modal');
        const gameoverTitle = document.getElementById('gameover-title');
        const gameoverSubtitle = document.getElementById('gameover-subtitle');
        const goSummaryTime = document.getElementById('go-summary-time');
        const goSummaryRawKills = document.getElementById('go-summary-raw-kills');
        const goSummaryMultiplier = document.getElementById('go-summary-multiplier');
        const goSummaryClearBonusRow = document.getElementById('go-summary-clear-bonus-row');
        const goSummaryClearBonus = document.getElementById('go-summary-clear-bonus');
        const goSummaryKills = document.getElementById('go-summary-kills');
        const goSummaryLevel = document.getElementById('go-summary-level');
        const playerNameInput = document.getElementById('player-name-input');
        const saveScoreBtn = document.getElementById('save-score-btn');
        const scoreInputSection = document.getElementById('score-input-section');
        const restartGameBtn = document.getElementById('restart-game-btn');
        const gotoMenuBtn = document.getElementById('goto-menu-btn');
        const leaderboardList = document.getElementById('leaderboard-list');
        const leaderboardSection = document.getElementById('leaderboard-section');
        const gameoverButtons = document.getElementById('gameover-buttons');

        const skillConfigList = document.getElementById('skill-config-list');

        const defaultSkillConfigs = {
            magicBullet: { name: "魔法彈", enabled: true, level: 1, maxLevel: 9, baseDamage: 10, cooldown: 500, count: 1, penetration: 1 },
            sniper: { name: "狙擊", enabled: true, level: 1, maxLevel: 9, baseDamage: 50, cooldown: 1500, count: 1, penetration: 1 },
            fireball: { name: "火球術", enabled: true, level: 1, maxLevel: 9, baseDamage: 10, cooldown: 1000, count: 1, baseRadius: 20, explosionRadius: 20 },
            spinBullet: { name: "蜂巢飛彈", enabled: true, level: 1, maxLevel: 9, baseDamage: 12, cooldown: 2000, shotCooldown: 750, bulletCount: 4, penetration: 2 },
            lightning: { name: "閃電風暴", enabled: true, level: 1, maxLevel: 9, baseDamage: 10, cooldown: 1200, count: 5 }
        };

        let skillConfigs = JSON.parse(JSON.stringify(defaultSkillConfigs));
        let hasMagicSpinUnlocked = false;
        let hasThunderSniperUnlocked = false;
        let hasMagicFireUnlocked = false;
        const currentScoreMultiplier = 1.0;
        let finalCalculatedScore = 0;

        let leaderboardData = [];
        try {
            const savedScores = localStorage.getItem('vampire_survivors_leaderboard_portrait');
            if (savedScores) leaderboardData = JSON.parse(savedScores);
        } catch(e) {}

        function renderLeaderboard() {
            leaderboardList.innerHTML = '';
            const sorted = [...leaderboardData].sort((a, b) => b.score - a.score);
            if (sorted.length === 0) {
                leaderboardList.innerHTML = '<div class="text-slate-500 text-center py-2">尚無排行榜紀錄</div>';
                return;
            }
            sorted.slice(0, 100).forEach((entry, idx) => {
                const row = document.createElement('div');
                row.className = "flex justify-between items-center text-slate-300 py-1 px-2 border-b border-slate-900/60 bg-slate-950/40 rounded";
                row.innerHTML = `
                    <span class="truncate pr-2"><strong class="text-amber-400 font-bold">${idx + 1}.</strong> ${escapeHtml(entry.name)} <span class="text-emerald-400 text-[10px]">(${entry.level}等)</span></span>
                    <span class="text-cyan-300 font-bold whitespace-nowrap">${entry.score} 分 <span class="text-slate-400 font-normal text-[10px]">(${entry.time})</span></span>
                `;
                leaderboardList.appendChild(row);
            });
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        gotoMenuBtn.onclick = () => {
            gameoverModal.classList.add('hidden');
            menuModal.classList.remove('hidden');
        };

        restartGameBtn.onclick = () => {
            gameoverModal.classList.add('hidden');
            startGame();
        };

        saveScoreBtn.onclick = () => {
            const name = playerNameInput.value.trim() || '無名倖存者';
            const totalSecs = Math.floor(gameTime / 1000);
            const mins = String(Math.floor(totalSecs / 60)).padStart(2, '0');
            const secs = String(totalSecs % 60).padStart(2, '0');

            leaderboardData.push({
                name: name,
                score: finalCalculatedScore,
                time: `${mins}:${secs}`,
                level: player ? player.level : 1
            });
            leaderboardData.sort((a, b) => b.score - a.score);
            if (leaderboardData.length > 100) leaderboardData = leaderboardData.slice(0, 100);

            try {
                localStorage.setItem('vampire_survivors_leaderboard_portrait', JSON.stringify(leaderboardData));
            } catch(e) {}

            scoreInputSection.classList.add('hidden');
            leaderboardSection.classList.remove('hidden');
            gameoverButtons.classList.remove('hidden');
            renderLeaderboard();
        };

        function renderSkillConfigUI() {
            skillConfigList.innerHTML = '';
            Object.keys(skillConfigs).forEach(key => {
                const skill = skillConfigs[key];
                const row = document.createElement('div');
                row.className = "flex items-center justify-between bg-slate-950/70 border border-slate-800 px-3 py-1.5 rounded-xl hover:bg-slate-900/90 transition cursor-pointer";
                row.innerHTML = `
                    <label for="chk-${key}" class="flex items-center gap-3 text-slate-100 font-bold text-base cursor-pointer w-full select-none">
                        <input type="checkbox" id="chk-${key}" ${skill.enabled ? 'checked' : ''} class="w-5 h-5 accent-amber-500 rounded cursor-pointer">
                        <span>${skill.name}</span>
                    </label>
                `;
                row.querySelector(`#chk-${key}`).onchange = (e) => {
                    skill.enabled = e.target.checked;
                };
                skillConfigList.appendChild(row);
            });
        }
        renderSkillConfigUI();

        const GAME_WIDTH = 900;
        const GAME_HEIGHT = 1600;
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;

        function resizeGameContainer() {
            const container = document.getElementById('game-container');
            const scaleX = window.innerWidth / GAME_WIDTH;
            const scaleY = window.innerHeight / GAME_HEIGHT;
            const scale = Math.min(scaleX, scaleY);
            container.style.transform = `translate(-50%, -50%) scale(${scale})`;
        }
        window.addEventListener('resize', resizeGameContainer);
        resizeGameContainer();

        let isGameRunning = false;
        let isPaused = false;
        let animationFrameId = null;
        let lastTimestamp = 0;
        let gameTime = 0;
        let killsCount = 0;
        let shieldDurationTimer = 0;
        let bossSpawnMilestones = {};
        let enemySpawnTimer = 0;
        let zhuanzhuanSpawnTimer = 0;
        let regenTimer = 0;
        let secondRegenTimer = 0;

        let player;
        let bullets = [];
        let enemyBullets = [];
        let enemies = [];
        let gems = [];
        let specialItems = [];
        let particles = [];
        let floatingTexts = [];
        let explosions = [];
        let lightnings = [];
        let lightningBeams = [];
        let vortexStars = [];

        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false, ' ': false };
        let touchStartPos = { x: 0, y: 0 };
        let touchCurrentPos = { x: 0, y: 0 };
        let touchActive = false;

        window.addEventListener('keydown', (e) => { 
            if (keys.hasOwnProperty(e.key) || e.key === ' ') {
                if (e.key === ' ') {
                    if (!keys[' '] && isGameRunning && !isPaused && shieldDurationTimer <= 0) {
                        if (killsCount >= 1000) {
                            killsCount -= 1000;
                            shieldDurationTimer = 1000;
                            player.hp = Math.min(player.maxHp, player.hp + player.maxHp * 0.5);
                            audio.playPowerup();
                            updateHUD();
                        }
                    }
                    keys[' '] = true;
                } else if (keys.hasOwnProperty(e.key)) {
                    keys[e.key] = true;
                }
            }
        });
        window.addEventListener('keyup', (e) => { 
            if (e.key === ' ') keys[' '] = false;
            else if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
        });

        function getCanvasPoint(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = GAME_WIDTH / rect.width;
            const scaleY = GAME_HEIGHT / rect.height;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        canvas.addEventListener('touchstart', (e) => {
            touchActive = true;
            const pt = getCanvasPoint(e.touches[0].clientX, e.touches[0].clientY);
            touchStartPos = { x: pt.x, y: pt.y };
            touchCurrentPos = { ...touchStartPos };
        });
        canvas.addEventListener('touchmove', (e) => {
            if (touchActive) {
                const pt = getCanvasPoint(e.touches[0].clientX, e.touches[0].clientY);
                touchCurrentPos = { x: pt.x, y: pt.y };
            }
        });
        canvas.addEventListener('touchend', () => { touchActive = false; });

        // ==========================================
        // 遊戲物件類別定義 (必須先於物件池宣告)
        // ==========================================
        class Player {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 8;
                this.hp = 100;
                this.maxHp = 100;
                this.baseDamageMultiplier = 1.0;
                this.level = 1;
                this.xp = 0;
                this.nextXp = 1;
                this.invincibleTimer = 0;

                this.damageLevel = 0;
                this.maxHpLevel = 0;
                this.speedLevel = 0;

                this.lastMagicBulletTime = 0;
                this.lastSniperBulletTime = 0;
                this.lastFireballTime = 0;
                this.lastSpinShotTime = 0;
                this.lastLightningTime = 0;
            }

            get speed() { return 3.2 + (this.speedLevel * 0.1); }
            get damageMultiplier() { return this.baseDamageMultiplier + (this.damageLevel * 0.1); }

            move(dx, dy) {
                const activeSpeed = this.speed;
                if (dx !== 0 && dy !== 0) {
                    dx *= 0.7071;
                    dy *= 0.7071;
                }
                this.x = Math.max(this.radius, Math.min(GAME_WIDTH - this.radius, this.x + dx * activeSpeed));
                this.y = Math.max(this.radius, Math.min(GAME_HEIGHT - this.radius, this.y + dy * activeSpeed));
            }

            takeDamage(amount, now) {
                if (shieldDurationTimer > 0) return;
                if (now && this.invincibleTimer > now) return;
                this.hp = Math.max(0, this.hp - amount);
                this.invincibleTimer = (now || performance.now()) + 100;
                updateHUD();
                if (this.hp <= 0) gameOver(false);
            }

            addXp(amount) {
                this.xp += amount;
                while (this.xp >= this.nextXp) {
                    this.xp -= this.nextXp;
                    this.level++;
                    
                    const healAmount = this.maxHp * 0.05;
                    this.hp = Math.min(this.maxHp, this.hp + healAmount);

                    if (this.nextXp < 512) this.nextXp *= 2;
                    else this.nextXp = 512;
                    audio.playPowerup();
                    triggerUpgradeModal();
                    if (isPaused) break;
                }
                updateHUD();
            }

            draw() {
                ctx.save();
                if (shieldDurationTimer > 0) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 26, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(234, 179, 8, 0.2)';
                    ctx.strokeStyle = '#eab308';
                    ctx.lineWidth = 2.5;
                    ctx.shadowColor = '#eab308';
                    ctx.shadowBlur = 14;
                    ctx.fill();
                    ctx.stroke();
                }

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                if (player.invincibleTimer > performance.now() && Math.floor(performance.now() / 30) % 2 === 0) {
                    ctx.fillStyle = '#93c5fd';
                } else {
                    ctx.fillStyle = '#ffffff';
                }
                ctx.shadowColor = '#ffffff';
                ctx.shadowBlur = 12;
                ctx.fill();

                const barWidth = 48;
                const barHeight = 6;
                const barX = this.x - barWidth / 2;
                const barY = this.y - this.radius - 18;

                ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
                ctx.strokeStyle = 'rgba(51, 65, 85, 0.8)';
                ctx.lineWidth = 1;
                ctx.fillRect(barX - 1, barY - 1, barWidth + 2, barHeight + 2);
                ctx.strokeRect(barX - 1, barY - 1, barWidth + 2, barHeight + 2);

                const hpRatio = Math.max(0, Math.min(1, this.hp / this.maxHp));
                ctx.fillStyle = hpRatio > 0.5 ? '#f43f5e' : hpRatio > 0.25 ? '#f59e0b' : '#ef4444';
                ctx.fillRect(barX, barY, barWidth * hpRatio, barHeight);

                ctx.font = 'bold 10px monospace';
                ctx.fillStyle = '#fbbf24';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#000000';
                ctx.shadowBlur = 4;
                ctx.fillText(`LV.${this.level}`, this.x, barY - 4);

                ctx.restore();
            }
        }

        class FloatingText {
            constructor() {}

                this.y += this.vy;

            draw() {

                ctx.font = 'bold 12px monospace';

        }

                ctx.shadowColor = '#eab308';

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 0.6, 0, Math.PI * 2);

        class LightningBeam {
            constructor() {
                this.hitEnemies = new Set();
            }
            update() {
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;

                const step = this.length / 6;
                ctx.moveTo(-halfLen, 0);
                ctx.lineTo(-halfLen + step, -2.5);
                ctx.lineTo(-halfLen + step * 2, 2.5);
                ctx.lineTo(-halfLen + step * 3, -2.5);
                ctx.lineTo(-halfLen + step * 4, 2.5);

        class VortexStar {
            constructor(x, y, damage, shotCooldown, bulletCount, penetration, isMagicSpin = false) {
                this.x = x;
                this.y = y;
                this.baseDamage = damage;
                this.shotCooldown = shotCooldown;
                this.bulletCount = bulletCount;
                this.penetration = penetration;
                this.isMagicSpin = isMagicSpin;
                this.lastShotTime = 0;
                this.angle = 0;
                this.duration = 8000;
                this.elapsed = 0;
            }
            update(delta, now) {
                this.elapsed += delta;
                this.angle += 0.08;
                if (now - this.lastShotTime >= this.shotCooldown) {
                    this.lastShotTime = now;
                    audio.playShoot();
                    const finalDamage = this.baseDamage * player.damageMultiplier;
                    const spiralCount = this.isMagicSpin ? this.bulletCount * 3 : this.bulletCount;
                    for (let i = 0; i < spiralCount; i++) {
                        const bulletAngle = this.angle + (Math.PI * 2 / spiralCount) * i;
                        bullets.push(bulletPool.get(
                            this.x, this.y, bulletAngle, finalDamage, 7.0, this.penetration, 8, 8, false, false, 35, true, this.isMagicSpin
                        ));
                    }
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle * 0.5);
                ctx.beginPath();
                ctx.moveTo(0, -8);
                ctx.lineTo(8, 0);
                ctx.lineTo(0, 8);
                ctx.lineTo(-8, 0);
                ctx.closePath();
                ctx.fillStyle = '#38bdf8';
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = this.isMagicSpin ? 18 : 12;
                ctx.fill();
                ctx.restore();
            }
        }

        class EnemyBullet {

        class Enemy {
            constructor() {}
            init(targetX = 0, targetY = 0) {
                const elapsedSeconds = Math.floor(gameTime / 1000);
                const elapsedMins = Math.floor(gameTime / 60000);
                let hpMultiplier = 1;
                if (elapsedSeconds >= 720) hpMultiplier = 4;
                else if (elapsedSeconds >= 600) hpMultiplier = 2;

                if (this.type === 'boss') {
                    this.size = 32;
                    this.speed = Math.min(2.5, 1.0 + (elapsedMins * 0.1));
                    const bossHp = (500 + Math.floor(elapsedSeconds / 30) * 500) * hpMultiplier;
                    this.hp = bossHp;
                    this.maxHp = bossHp;
                    this.damage = 25 + (elapsedMins * 2);
                    this.xpValue = 50;
                    this.color = '#ef4444';
                } else if (this.type === 'xiaohong') {
                    this.size = 16;
                    this.speed = Math.min(2.0, 1.0 + (elapsedMins * 0.1));
                    const baseHp = (10 + (elapsedSeconds * 0.5)) * hpMultiplier;
                    this.hp = baseHp;
                    this.maxHp = baseHp;
                    this.damage = 10;
                    this.xpValue = 1;
                    this.color = '#ef4444';
                } else if (this.type === 'wasp') {
                    this.size = 16;
                    this.speed = 60.0;
                    const waspHp = 15 * hpMultiplier;
                    this.hp = waspHp;
                    this.maxHp = waspHp;
                    this.damage = 15;
                    this.xpValue = 2;
                    this.color = '#eab308';
                    this.state = 'warning';
                    this.warningTimer = 0;
                    this.pauseTimer = 0;
                    this.angle = Math.atan2(player.y - this.y, player.x - this.x);
                } else if (this.type === 'zhuanzhuan') {
                    const totalSecs = Math.floor(gameTime / 1000);
                    const isUpgraded = totalSecs >= 300;
                    this.size = isUpgraded ? 48 : 16;
                    this.speed = isUpgraded ? 0.2 : (0.5 + Math.random() * 0.7);
                    const baseZhuanHp = 30 + (elapsedSeconds * 1);
                    const zhuanzhuanHp = (isUpgraded ? baseZhuanHp * 3 : baseZhuanHp) * hpMultiplier;
                    this.hp = zhuanzhuanHp;
                    this.maxHp = zhuanzhuanHp;
                    this.damage = isUpgraded ? 30 : 10;
                    this.xpValue = isUpgraded ? 20 : 5;
                    this.color = isUpgraded ? '#0284c7' : '#38bdf8';

                    const count = isUpgraded ? 3 : 1;
                    this.purpleBallAngles = [];
                    for (let i = 0; i < count; i++) {
                        this.purpleBallAngles.push((Math.PI * 2 / count) * i);
                    }
                    this.vx = 0;
                    this.vy = 0;
                    const dist = Math.hypot(targetX - this.x, targetY - this.y);
                    if (dist > 0) {
                        this.vx = ((targetX - this.x) / dist) * this.speed;
                        this.vy = ((targetY - this.y) / dist) * this.speed;
                    }
                }
            }

            takeDamage(amount) {
                this.hp -= amount;
                this.flashTimer = performance.now() + 80;
                floatingTexts.push(floatingTextPool.get(this.x, this.y - this.size / 2, Math.round(amount)));
            }

            update(now, delta) {
                if (this.type === 'boss' || this.type === 'xiaohong') {
                    if (this.type === 'boss') this.rotationAngle += 0.03;
                    const angleToPlayer = Math.atan2(player.y - this.y, player.x - this.x);
                    this.x += Math.cos(angleToPlayer) * this.speed;
                    this.y += Math.sin(angleToPlayer) * this.speed;
                } else if (this.type === 'wasp') {
                    if (this.state === 'warning') {
                        this.angle = Math.atan2(player.y - this.y, player.x - this.x);
                        this.warningTimer += delta;
                        if (this.warningTimer >= 1000) {
                            this.state = 'pausing';
                            this.pauseTimer = 0;
                        }
                    } else if (this.state === 'pausing') {
                        this.pauseTimer += delta;
                        if (this.pauseTimer >= 200) this.state = 'rushing';
                    } else if (this.state === 'rushing') {
                        this.x += Math.cos(this.angle) * this.speed;
                        this.y += Math.sin(this.angle) * this.speed;
                    }
                } else if (this.type === 'zhuanzhuan') {
                    this.x += this.vx;
                    this.y += this.vy;
                    const totalSecs = Math.floor(gameTime / 1000);
                    const isUpgraded = totalSecs >= 300;
                    const rotSpeed = isUpgraded ? 0.04 : 0.05;
                    for (let i = 0; i < this.purpleBallAngles.length; i++) {
                        this.purpleBallAngles[i] += rotSpeed;
                    }
                    this.shootTimer += delta;
                    if (isUpgraded) {
                        if (this.shootTimer >= 1500) {
                            this.shootTimer = 0;
                            const angleToPlayer = Math.atan2(player.y - this.y, player.x - this.x);
                            enemyBullets.push(enemyBulletPool.get(this.x, this.y, angleToPlayer, 3.0, 8, 30, true));
                        }
                    } else {
                        if (this.shootTimer >= 1800) {
                            this.shootTimer = 0;
                            const angleToPlayer = Math.atan2(player.y - this.y, player.x - this.x);
                            enemyBullets.push(enemyBulletPool.get(this.x, this.y, angleToPlayer, 3.5, 8, 10, false));
                        }
                    }
                }
            }

            draw() {
                ctx.save();
                const isFlashing = this.flashTimer > performance.now();
                const renderColor = isFlashing ? '#ffffff' : this.color;

                if (this.type === 'wasp' && (this.state === 'warning' || this.state === 'pausing')) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.setLineDash([6, 6]);
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x + Math.cos(this.angle) * 2500, this.y + Math.sin(this.angle) * 2500);
                    ctx.strokeStyle = '#ef4444';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.restore();
                }

                ctx.translate(this.x, this.y);

                if (this.type === 'zhuanzhuan') {
                    const totalSecs = Math.floor(gameTime / 1000);
                    const isUpgraded = totalSecs >= 300;
                    const coreRadius = isUpgraded ? 24 : 8;
                    ctx.beginPath();
                    ctx.arc(0, 0, coreRadius, 0, Math.PI * 2);
                    ctx.fillStyle = renderColor;
                    ctx.shadowColor = '#0ea5e9';
                    ctx.shadowBlur = isUpgraded ? 20 : 10;
                    ctx.fill();

                    const orbitRadius = isUpgraded ? 144 : 48;
                    const ballRadius = isUpgraded ? 12 : 4;
                    for (let i = 0; i < this.purpleBallAngles.length; i++) {
                        const ballX = Math.cos(this.purpleBallAngles[i]) * orbitRadius;
                        const ballY = Math.sin(this.purpleBallAngles[i]) * orbitRadius;
                        ctx.beginPath();
                        ctx.arc(ballX, ballY, ballRadius, 0, Math.PI * 2);
                        ctx.fillStyle = '#a855f7';
                        ctx.shadowColor = '#c084fc';
                        ctx.shadowBlur = isUpgraded ? 16 : 8;
                        ctx.fill();
                    }
                } else {
                    if (this.type === 'boss') ctx.rotate(this.rotationAngle);
                    else if (this.type === 'wasp') ctx.rotate(this.angle);
                    else ctx.rotate(Math.atan2(player.y - this.y, player.x - this.x));

                    ctx.beginPath();
                    const halfSize = this.size / 2;
                    ctx.moveTo(halfSize, 0);
                    ctx.lineTo(-halfSize, -halfSize);
                    ctx.lineTo(-halfSize, halfSize);
                    ctx.closePath();
                    ctx.fillStyle = renderColor;
                    ctx.shadowColor = renderColor;
                    ctx.shadowBlur = this.type === 'boss' ? 16 : 8;
                    ctx.fill();

                    if (this.type === 'boss') {
                        ctx.rotate(-this.rotationAngle);
                        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                        ctx.fillRect(-20, -28, 40, 6);
                        ctx.fillStyle = '#ef4444';
                        ctx.fillRect(-20, -28, 40 * (Math.max(0, this.hp) / this.maxHp), 6);
                    }
                }
                ctx.restore();
            }
        }

        class Bullet {
            constructor() {
                this.hitEnemies = new Set();
            }

            update(delta) {
                this.prevX = this.x;
                this.prevY = this.y;
                if (this.isVortex) {
                    this.angle += 0.03;
                    this.elapsed += delta;
                }
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                if (this.isFireball) {
                    ctx.fillStyle = 'rgba(249, 115, 22, 0.35)';
                    ctx.beginPath();
                    ctx.arc(0, 0, this.explosionRadius * 0.5, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#ef4444';
                    ctx.shadowColor = '#f97316';
                    ctx.shadowBlur = 14;
                    ctx.beginPath();
                    ctx.arc(0, 0, 11, 0, Math.PI * 2);
                    ctx.fill();
                } else if (this.isSniper || this.isThunderSniper) {
                    const hw = this.width / 2;
                    const hh = this.height / 2;
                    const grad = ctx.createLinearGradient(-hw, 0, hw, 0);
                    grad.addColorStop(0, this.isThunderSniper ? 'rgba(234, 179, 8, 0)' : 'rgba(250, 204, 21, 0)');
                    grad.addColorStop(0.6, this.isThunderSniper ? 'rgba(234, 179, 8, 0.8)' : 'rgba(250, 204, 21, 0.7)');
                    grad.addColorStop(1, '#fef08a');
                    ctx.fillStyle = grad;
                    ctx.shadowColor = this.isThunderSniper ? '#eab308' : '#f59e0b';
                    ctx.shadowBlur = this.isThunderSniper ? 22 : 18;
                    ctx.fillRect(-hw, -hh, hw, this.height);
                    ctx.beginPath();
                    ctx.moveTo(hw, 0);
                    ctx.lineTo(0, -hh);
                    ctx.lineTo(0, hh);
                    ctx.closePath();
                    ctx.fill();
                } else if (this.isVortex) {
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowColor = '#38bdf8';
                    ctx.shadowBlur = this.isMagicSpin ? 14 : 8;
                    ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);
                } else {
                    ctx.fillStyle = this.isMagicFire ? '#f97316' : '#38bdf8';
                    ctx.shadowColor = this.isMagicFire ? '#ea580c' : '#0284c7';
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    if (ctx.roundRect) ctx.roundRect(-this.width / 2, -this.height / 2, this.width, this.height, 2);
                    else ctx.rect(-this.width / 2, -this.height / 2, this.width, this.height);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        class Explosion {
            constructor() {}
            update(delta) {
                this.elapsed += delta;
                const progress = Math.min(1, this.elapsed / this.duration);
                this.currentRadius = 4 + (this.maxRadius - 4) * progress;
            }
            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.currentRadius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(249, 115, 22, 0.35)';
                ctx.strokeStyle = '#f97316';
                ctx.lineWidth = 3;
                ctx.shadowColor = '#f97316';
                ctx.shadowBlur = 16;
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }
        }

        class Gem {
            constructor() {}
            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.restore();
            }
        }

        class Particle {
            constructor() {}
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();

        }

        class LightningStrike {
            constructor(x, y, damage, beamDamage, lightningLevel = 1) {
                this.x = x;
                this.y = y;
                this.damage = damage;
                this.beamDamage = beamDamage;
                this.lightningLevel = lightningLevel;
                this.duration = 200;
                this.elapsed = 0;
                this.hasSpawnedBeams = false;
                this.hasDealtDamage = false;
                this.orbs = [];
                for (let i = 0; i < 3; i++) {
                    this.orbs.push({
                        angle: (Math.PI * 2 / 3) * i,
                        radius: 18 + Math.random() * 8,
                        speed: 0.15 + Math.random() * 0.1
                    });
                }
            }
            update(delta) {
                this.elapsed += delta;
                this.orbs.forEach(orb => { orb.angle += orb.speed; });

                if (!this.hasDealtDamage) {
                    this.hasDealtDamage = true;
                    enemies.forEach(en => {
                        const dist = Math.hypot(en.x - this.x, en.y - this.y);
                        if (dist <= en.size / 2 + 30) {
                            en.takeDamage(this.damage);
                            audio.playHit();
                        }
                    });
                }

                if (!this.hasSpawnedBeams) {
                    this.hasSpawnedBeams = true;
                    for (let i = 0; i < 3; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        lightningBeams.push(lightningBeamPool.get(this.x, this.y, angle, this.beamDamage, true));
                    }
                }
            }
            draw() {
                ctx.save();
                this.orbs.forEach(orb => {
                    const orbX = this.x + Math.cos(orb.angle) * orb.radius;
                    const orbY = this.y + Math.sin(orb.angle) * orb.radius;
                    ctx.beginPath();
                    ctx.arc(orbX, orbY, 4, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowColor = '#ffffff';
                    ctx.shadowBlur = 8;
                    ctx.fill();
                });
                ctx.beginPath();
                ctx.moveTo(this.x, this.y - 300);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = '#fef08a';
                ctx.lineWidth = 4;
                ctx.shadowColor = '#eab308';
                ctx.shadowBlur = 15;
                ctx.stroke();
                ctx.restore();
            }
        }

        // ==========================================
        // 各類物件池 (Object Pool) 初始化（必須放在 Class 定義之後）
        // ==========================================
        const bulletPool = new ObjectPool(
            () => new Bullet(),
            (b, x, y, angle, damage, speed, penetration, width, height, isFireball, isSniper, explosionRadius, isVortex, isMagicSpin, fireballBaseDamage, isThunderSniper, sniperBaseDamage, isMagicFire, magicFireDamage) => {
                b.x = x; b.y = y; b.angle = angle; b.damage = damage; b.speed = speed;
                b.penetration = penetration; b.hits = 0; b.width = width; b.height = height;
                b.isFireball = isFireball; b.isSniper = isSniper; b.explosionRadius = explosionRadius;
                b.isVortex = isVortex; b.isMagicSpin = isMagicSpin; b.fireballBaseDamage = fireballBaseDamage;
                b.isThunderSniper = isThunderSniper; b.sniperBaseDamage = sniperBaseDamage;
                b.isMagicFire = isMagicFire; b.magicFireDamage = magicFireDamage;
                b.prevX = x; b.prevY = y; b.elapsed = 0; b.maxLifetime = isVortex ? 5000 : 0;
                b.hitEnemies.clear();
            },
            100
        );

        const enemyBulletPool = new ObjectPool(
            () => new EnemyBullet(),
            (eb, x, y, angle, speed, size, damage, isLargeRed) => {
                eb.x = x; eb.y = y; eb.angle = angle; eb.speed = speed || 4;
                eb.size = size || 8; eb.damage = damage || 10; eb.isLargeRed = !!isLargeRed;
            },
            50
        );

        const enemyPool = new ObjectPool(
            () => new Enemy(),
            (en, x, y, type, targetX, targetY) => {
                en.x = x; en.y = y; en.type = type; en.flashTimer = 0;
                en.rotationAngle = 0; en.shootTimer = 0; en.init(targetX, targetY);
            },
            100
        );

        const gemPool = new ObjectPool(
            () => new Gem(),
            (g, x, y, value, color) => {
                g.x = x; g.y = y; g.value = value; g.color = color || '#10b981';
                g.radius = value >= 50 ? 9 : (value >= 10 ? 7 : 4);
                g.isMagnetized = false;
            },
            100
        );

        const particlePool = new ObjectPool(
            () => new Particle(),
            (pt, x, y, color) => {
                pt.x = x; pt.y = y; pt.color = color;
                pt.radius = Math.random() * 2.5 + 1;
                const angle = Math.random() * Math.PI * 2;

        const lightningBeamPool = new ObjectPool(

        function fireMagicBullets(now) {
            if (!skillConfigs.magicBullet || !skillConfigs.magicBullet.enabled) return;
            const cfg = skillConfigs.magicBullet;
            if (now - player.lastMagicBulletTime < cfg.cooldown) return;
            player.lastMagicBulletTime = now;
            audio.playShoot();

            let targetAngle = 0;
            if (enemies.length > 0) {
                let nearestEnemy = enemies[0];
                let minDist = Math.hypot(nearestEnemy.x - player.x, nearestEnemy.y - player.y);
                for (let i = 1; i < enemies.length; i++) {
                    const dist = Math.hypot(enemies[i].x - player.x, enemies[i].y - player.y);
                    if (dist < minDist) {
                        minDist = dist;
                        nearestEnemy = enemies[i];
                    }
                }
                targetAngle = Math.atan2(nearestEnemy.y - player.y, nearestEnemy.x - player.x);
            } else {
                targetAngle = Math.random() * Math.PI * 2;
            }

            const levelDamageBonus = (cfg.level - 1) * 12;
            const finalDamage = (cfg.baseDamage + levelDamageBonus) * player.damageMultiplier;
            const spread = 0.15;
            const startAngle = targetAngle - (spread * (cfg.count - 1)) / 2;
            
            const fireballCfg = skillConfigs.fireball;
            const magicFireDmg = fireballCfg ? ((fireballCfg.baseDamage * player.damageMultiplier) / 2) : 10;
            let finalPen = cfg.penetration || 1;
            if (hasMagicFireUnlocked) finalPen = Math.max(1, finalPen - 1);

            for (let i = 0; i < cfg.count; i++) {
                const angle = startAngle + spread * i;
                bullets.push(bulletPool.get(
                    player.x, player.y, angle, finalDamage, 7, finalPen, 16, 6, 
                    false, false, 35, false, false, 0, false, 0, hasMagicFireUnlocked, magicFireDmg
                ));
            }

            if (cfg.level >= 9) {
                const offsetAngle = targetAngle + (15 * Math.PI / 180);
                const offStartAngle = offsetAngle - (spread * (cfg.count - 1)) / 2;
                for (let i = 0; i < cfg.count; i++) {
                    const angle = offStartAngle + spread * i;
                    bullets.push(bulletPool.get(
                        player.x, player.y, angle, finalDamage, 7, finalPen, 16, 6, 
                        false, false, 35, false, false, 0, false, 0, hasMagicFireUnlocked, magicFireDmg
                    ));
                }
            }
        }

            audio.playShoot();

            let targetAngle = 0;

                for (let i = 1; i < enemies.length; i++) {

                ));

        }

        function fireBullets(now) {
            if (hasMagicFireUnlocked) return;
            if (!skillConfigs.fireball || !skillConfigs.fireball.enabled) return;
            const cfg = skillConfigs.fireball;
            if (now - player.lastFireballTime < cfg.cooldown) return;
            player.lastFireballTime = now;
            audio.playShoot();

            let targetAngle = 0;
            if (enemies.length > 0) {
                let nearestEnemy = enemies[0];
                let minDist = Math.hypot(nearestEnemy.x - player.x, nearestEnemy.y - player.y);
                for (let i = 1; i < enemies.length; i++) {
                    const dist = Math.hypot(enemies[i].x - player.x, enemies[i].y - player.y);

                        nearestEnemy = enemies[i];
                    }
                }
                targetAngle = Math.atan2(nearestEnemy.y - player.y, nearestEnemy.x - player.x);
            } else {
                targetAngle = Math.random() * Math.PI * 2;

        function fireSpinBullets(now) {
            if (!skillConfigs.spinBullet || !skillConfigs.spinBullet.enabled) return;
            const cfg = skillConfigs.spinBullet;
            if (now - player.lastSpinShotTime < cfg.cooldown) return;

            const spawnDist = 40 + Math.random() * 60;
            const spawnAngle = Math.random() * Math.PI * 2;
            const starX = player.x + Math.cos(spawnAngle) * spawnDist;
            const starY = player.y + Math.sin(spawnAngle) * spawnDist;
            const finalPen = hasMagicSpinUnlocked ? (cfg.penetration || 2) + 1 : (cfg.penetration || 2);

            const actualSpinDamage = cfg.baseDamage + levelDamageBonus;

        function triggerLightning(now) {
            if (hasThunderSniperUnlocked) return;
            if (!skillConfigs.lightning || !skillConfigs.lightning.enabled) return;
            const cfg = skillConfigs.lightning;
            if (now - player.lastLightningTime < cfg.cooldown) return;
            player.lastLightningTime = now;

            const visibleEnemies = enemies.filter(en => en.x >= 0 && en.x <= GAME_WIDTH && en.y >= 0 && en.y <= GAME_HEIGHT);
            if (visibleEnemies.length === 0) return;

            const shuffledEnemies = [...visibleEnemies].sort(() => 0.5 - Math.random());
            const targets = shuffledEnemies.slice(0, cfg.count);
            
            let lightningDmgBase = cfg.baseDamage + (cfg.level - 1) * 3;
            const finalDamage = lightningDmgBase * player.damageMultiplier;
            const beamDamage = finalDamage / 5;

            targets.forEach(target => {
                lightnings.push(new LightningStrike(target.x, target.y, finalDamage, beamDamage, cfg.level));
                audio.playWarning();
            });
        }

        function spawnEnemy() {
            const currentNonBossCount = enemies.filter(e => e.type !== 'boss').length;
            if (currentNonBossCount >= 300) return;

            const isWaspGroup = Math.random() < 0.3;
            const elapsedSeconds = Math.floor(gameTime / 1000);
            const isAfter12Mins = elapsedSeconds >= 720;

            if (isWaspGroup) {
                audio.playWarning();
                const count = isAfter12Mins ? (Math.floor(Math.random() * 4) + 3) : (Math.floor(Math.random() * 5) + 1);
                for (let i = 0; i < count; i++) {
                    if (enemies.filter(e => e.type !== 'boss').length >= 300) break;
                    const side = Math.floor(Math.random() * 4);
                    let x, y;
                    const offset = 60 + Math.random() * 40;
                    if (side === 0) { x = Math.random() * GAME_WIDTH; y = -offset; }
                    else if (side === 1) { x = GAME_WIDTH + offset; y = Math.random() * GAME_HEIGHT; }
                    else if (side === 2) { x = Math.random() * GAME_WIDTH; y = GAME_HEIGHT + offset; }
                    else { x = -offset; y = Math.random() * GAME_HEIGHT; }
                    enemies.push(enemyPool.get(x, y, 'wasp'));
                }
            } else {
                const xiaohongCount = isAfter12Mins ? 99 : (1 + Math.floor(elapsedSeconds / 15));
                for (let i = 0; i < xiaohongCount; i++) {
                    if (enemies.filter(e => e.type !== 'boss').length >= 300) break;
                    const side = Math.floor(Math.random() * 4);
                    let x, y;
                    const offset = 60 + (i * 2);
                    if (side === 0) { x = Math.random() * GAME_WIDTH; y = -offset; }
                    else if (side === 1) { x = GAME_WIDTH + offset; y = Math.random() * GAME_HEIGHT; }
                    else if (side === 2) { x = Math.random() * GAME_WIDTH; y = GAME_HEIGHT + offset; }
                    else { x = -offset; y = Math.random() * GAME_HEIGHT; }
                    enemies.push(enemyPool.get(x, y, 'xiaohong'));
                }
            }
        }

        function spawnZhuanzhuan() {
            if (enemies.filter(e => e.type !== 'boss').length >= 300) return;
            const elapsedSeconds = Math.floor(gameTime / 1000);
            const isAfter12Mins = elapsedSeconds >= 720;
            const spawnCount = isAfter12Mins ? 2 : 1;

            for (let c = 0; c < spawnCount; c++) {
                if (enemies.filter(e => e.type !== 'boss').length >= 300) break;
                const startSide = Math.floor(Math.random() * 4);
                let startX, startY;
                const margin = 50;

                if (startSide === 0) { startX = Math.random() * GAME_WIDTH; startY = -margin; }
                else if (startSide === 1) { startX = GAME_WIDTH + margin; startY = Math.random() * GAME_HEIGHT; }
                else if (startSide === 2) { startX = Math.random() * GAME_WIDTH; startY = GAME_HEIGHT + margin; }
                else { startX = -margin; startY = Math.random() * GAME_HEIGHT; }

                const targetSide = (startSide + 2) % 4;
                let targetX, targetY;
                if (targetSide === 0) { targetX = Math.random() * GAME_WIDTH; targetY = -margin; }
                else if (targetSide === 1) { targetX = GAME_WIDTH + margin; targetY = Math.random() * GAME_HEIGHT; }
                else if (targetSide === 2) { targetX = Math.random() * GAME_WIDTH; targetY = GAME_HEIGHT + margin; }
                else { targetX = -margin; targetY = Math.random() * GAME_HEIGHT; }

                enemies.push(enemyPool.get(startX, startY, 'zhuanzhuan', targetX, targetY));
            }
        }

        function spawnBoss() {
            const currentBossCount = enemies.filter(e => e.type === 'boss').length;
            if (currentBossCount >= 40) return;

            const elapsedSeconds = Math.floor(gameTime / 1000);
            const isAfter12Mins = elapsedSeconds >= 720;
            let spawnCount = isAfter12Mins ? 8 : 1;

            for (let i = 0; i < spawnCount; i++) {
                const side = Math.floor(Math.random() * 4);
                let x, y;
                const offset = 80;
                if (side === 0) { x = Math.random() * GAME_WIDTH; y = -offset; }
                else if (side === 1) { x = GAME_WIDTH + offset; y = Math.random() * GAME_HEIGHT; }
                else if (side === 2) { x = Math.random() * GAME_WIDTH; y = GAME_HEIGHT + offset; }
                else { x = -offset; y = Math.random() * GAME_HEIGHT; }
                enemies.push(enemyPool.get(x, y, 'boss'));
            }
        }

        function triggerUpgradeModal() {
            isPaused = true;
            upgradeCards.innerHTML = '';

            const availableSkills = Object.keys(skillConfigs).filter(key => {
                if (hasThunderSniperUnlocked && key === 'lightning') return false;
                if (hasMagicFireUnlocked && key === 'fireball') return false;
                return skillConfigs[key].enabled && skillConfigs[key].level < skillConfigs[key].maxLevel;
            });

            const lockedSkills = Object.keys(skillConfigs).filter(key => {
                if (hasThunderSniperUnlocked && key === 'lightning') return false;
                if (hasMagicFireUnlocked && key === 'fireball') return false;
                return skillConfigs[key].enabled && skillConfigs[key].level === 0;
            });

            const canUnlockMagicSpin = !hasMagicSpinUnlocked && !hasMagicFireUnlocked && 
                skillConfigs.magicBullet.enabled && skillConfigs.magicBullet.level >= 9 && 
                skillConfigs.spinBullet.enabled && skillConfigs.spinBullet.level >= 9;

            const canUnlockThunderSniper = !hasThunderSniperUnlocked &&
                skillConfigs.sniper.enabled && skillConfigs.sniper.level >= 9 &&
                skillConfigs.lightning.enabled && skillConfigs.lightning.level >= 9;

            const canUnlockMagicFire = !hasMagicFireUnlocked && !hasMagicSpinUnlocked &&
                skillConfigs.magicBullet.enabled && skillConfigs.magicBullet.level >= 9 &&
                skillConfigs.fireball.enabled && skillConfigs.fireball.level >= 9;

            let baseOptions = [
                { type: 'maxhp', name: `最大生命提升 (+2 HP) [Lv.${player.maxHpLevel+1}]`, desc: '增加 2 點最大生命與當前生命' },
                { type: 'damage', name: `提升攻擊力 (+10% 傷害) [Lv.${player.damageLevel+1}]`, desc: '增加全體技能 10% 額外傷害' },
                { type: 'speed', name: `移動速度提升 (+0.1 速度) [Lv.${player.speedLevel+1}]`, desc: '增加玩家移動速度 0.1' }
            ];

            let options = [];
            let safetyCounter = 0;

            while (options.length < 3 && safetyCounter < 100) {
                safetyCounter++;
                let candidate = null;

                if (canUnlockThunderSniper && !options.some(o => o.type === 'thunderSniper') && Math.random() < 0.5) {
                    candidate = { type: 'thunderSniper', name: '⚡ 融合升級: 雷霆狙擊', desc: '閃電風暴與狙擊融合！隨機劈雷關閉。狙擊子彈擊中敵人時會向四周射出固定 3 條直線電流（無穿透），冷卻大幅縮短至 0.2 秒！' };
                } else if (canUnlockMagicFire && !options.some(o => o.type === 'magicFire') && Math.random() < 0.5) {
                    candidate = { type: 'magicFire', name: '🔥 融合升級: 魔法火球', desc: '火球術技能關閉。以魔力彈為基礎，魔力彈擊中敵人時會引發火球術爆炸（魔法彈穿透力 -1）！' };
                } else if (canUnlockMagicSpin && !options.some(o => o.type === 'magicSpin') && Math.random() < 0.5) {
                    candidate = { type: 'magicSpin', name: '🌟 融合升級: 魔法蜂巢飛彈', desc: '魔法彈技能關閉。蜂巢蜜蜂數量 ×3，穿透 +1，且蜂群撞擊敵人時有 15% 機率產生一隻新蜂群！' };
                } else if (availableSkills.length > 0 && Math.random() < 0.45) {
                    const sKey = availableSkills[Math.floor(Math.random() * availableSkills.length)];
                    candidate = { type: 'skill', key: sKey, data: skillConfigs[sKey] };
                } else if (lockedSkills.length > 0 && Math.random() < 0.3) {
                    const sKey = lockedSkills[Math.floor(Math.random() * lockedSkills.length)];
                    candidate = { type: 'unlock', key: sKey, data: skillConfigs[sKey] };
                } else if (baseOptions.length > 0) {
                    candidate = baseOptions[Math.floor(Math.random() * baseOptions.length)];
                }

                if (candidate) {
                    let isDuplicate = false;
                    if (candidate.type === 'skill' || candidate.type === 'unlock') {
                        isDuplicate = options.some(o => o.key === candidate.key);
                    } else {
                        isDuplicate = options.some(o => o.type === candidate.type);
                    }
                    if (!isDuplicate) options.push(candidate);
                }
            }

            if (options.length === 0) {
                isPaused = false;
                lastTimestamp = performance.now();
                return;
            }

            options.slice(0, 3).forEach(opt => {
                const card = document.createElement('div');
                card.className = "flex-1 bg-slate-900 border border-slate-700 hover:border-amber-400 p-4 rounded-2xl flex flex-col justify-between cursor-pointer transition transform hover:-translate-y-1 shadow-xl";
                
                let title = "", desc = "";
                if (opt.type === 'thunderSniper' || opt.type === 'magicSpin' || opt.type === 'magicFire') {
                    title = opt.name;
                    desc = opt.desc;
                } else if (opt.type === 'skill') {
                    title = `升級: ${opt.data.name} (Lv.${opt.data.level} → Lv.${opt.data.level + 1})`;
                    desc = `提升技能威力與效果`;
                } else if (opt.type === 'unlock') {
                    title = `解鎖新技能: ${opt.data.name}`;
                    desc = `獲得全新強力攻擊武器`;
                } else {
                    title = opt.name;
                    desc = opt.desc;
                }

                card.innerHTML = `
                    <div>
                        <h3 class="text-sm font-bold text-amber-400 mb-1">${title}</h3>
                        <p class="text-slate-300 text-[11px]">${desc}</p>
                    </div>
                    <div class="mt-3 text-right">
                        <span class="inline-block bg-amber-500/20 text-amber-300 text-xs font-bold px-3 py-1 rounded-lg">選擇升級</span>
                    </div>
                `;
                card.onclick = () => {
                    applyUpgrade(opt);
                    upgradeModal.classList.add('hidden');
                    isPaused = false;
                    lastTimestamp = performance.now();
                };
                upgradeCards.appendChild(card);
            });
            upgradeModal.classList.remove('hidden');
        }

        function applyUpgrade(opt) {
            if (opt.type === 'thunderSniper') {
                hasThunderSniperUnlocked = true;
                skillConfigs.lightning.enabled = false;
            } else if (opt.type === 'magicFire') {
                hasMagicFireUnlocked = true;
                skillConfigs.fireball.enabled = false;
            } else if (opt.type === 'magicSpin') {
                hasMagicSpinUnlocked = true;
                skillConfigs.magicBullet.enabled = false;
            } else if (opt.type === 'skill') {
                skillConfigs[opt.key].level++;
            } else if (opt.type === 'unlock') {
                skillConfigs[opt.key].enabled = true;
                skillConfigs[opt.key].level = 1;
            } else if (opt.type === 'maxhp') {
                player.maxHpLevel++;
                player.maxHp += 2;
                player.hp += 2;
            } else if (opt.type === 'damage') {
                player.damageLevel++;
            } else if (opt.type === 'speed') {
                player.speedLevel++;
            }
            updateHUD();
        }

        function updateHUD() {
            scoreTxt.innerText = killsCount;
        }

        function startGame() {
            audio.init();
            menuModal.classList.add('hidden');
            gameoverModal.classList.add('hidden');
            hud.classList.remove('hidden');

            skillConfigs = JSON.parse(JSON.stringify(defaultSkillConfigs));
            hasMagicSpinUnlocked = false;
            hasThunderSniperUnlocked = false;
            hasMagicFireUnlocked = false;
            
            Object.keys(skillConfigs).forEach(key => {
                const chk = document.getElementById(`chk-${key}`);
                if (chk) {
                    skillConfigs[key].enabled = chk.checked;
                    if (!chk.checked) skillConfigs[key].level = 0;
                }
            });

            player = new Player(GAME_WIDTH / 2, GAME_HEIGHT / 2);
            gameTime = 0;

            bullets = [];
            enemyBullets = [];
            enemies = [];
            gems = [];
            specialItems = [];
            particles = [];
            floatingTexts = [];
            explosions = [];
            lightnings = [];
            lightningBeams = [];
            vortexStars = [];

            killsCount = 0;
            shieldDurationTimer = 0;
            bossSpawnMilestones = {};
            enemySpawnTimer = 0;
            zhuanzhuanSpawnTimer = 0;
            regenTimer = 0;
            secondRegenTimer = 0;
            isGameRunning = true;
            isPaused = false;
            lastTimestamp = performance.now();

            updateHUD();
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function gameLoop(timestamp) {
            if (!isGameRunning) return;
            const delta = timestamp - lastTimestamp;
            lastTimestamp = timestamp;

            if (!isPaused) {
                gameTime += delta;

                if (shieldDurationTimer > 0) {
                    shieldDurationTimer -= delta;
                    if (shieldDurationTimer < 0) shieldDurationTimer = 0;
                }

                secondRegenTimer += delta;
                if (secondRegenTimer >= 1000) {
                    secondRegenTimer -= 1000;
                    if (player.hp < player.maxHp) {
                        player.hp = Math.min(player.maxHp, player.hp + 1);
                        updateHUD();
                    }
                }

                regenTimer += delta;
                if (regenTimer >= 10000) {
                    regenTimer -= 10000;
                    if (player.hp < player.maxHp) {
                        player.hp = Math.min(player.maxHp, player.hp + 2);
                        updateHUD();
                    }
                }

                const totalSecs = Math.floor(gameTime / 1000);
                const mins = String(Math.floor(totalSecs / 60)).padStart(2, '0');
                const secs = String(totalSecs % 60).padStart(2, '0');
                timerTxt.innerText = `${mins}:${secs} / 15:00`;

                if (totalSecs >= 900) { gameOver(true); return; }

                if (totalSecs >= 30 && totalSecs % 30 === 0) {
                    if (!bossSpawnMilestones[totalSecs]) {
                        bossSpawnMilestones[totalSecs] = true;
                        bossWarning.classList.remove('hidden');
                        audio.playWarning();
                        setTimeout(() => bossWarning.classList.add('hidden'), 4000);
                        spawnBoss();
                    }
                }

                let currentSpawnInterval = 800;
                if (totalSecs >= 600) currentSpawnInterval = 400;
                else if (totalSecs >= 300) currentSpawnInterval = 500;

                enemySpawnTimer += delta;
                if (enemySpawnTimer >= currentSpawnInterval) {
                    enemySpawnTimer = 0;
                    spawnEnemy();
                }

                zhuanzhuanSpawnTimer += delta;
                if (zhuanzhuanSpawnTimer >= 4000) {
                    zhuanzhuanSpawnTimer = 0;
                    spawnZhuanzhuan();
                }

                let dx = 0, dy = 0;
                if (keys.w || keys.ArrowUp) dy -= 1;
                if (keys.s || keys.ArrowDown) dy += 1;
                if (keys.a || keys.ArrowLeft) dx -= 1;
                if (keys.d || keys.ArrowRight) dx += 1;

                if (touchActive) {
                    const tdx = touchCurrentPos.x - touchStartPos.x;
                    const tdy = touchCurrentPos.y - touchStartPos.y;
                    const dist = Math.hypot(tdx, tdy);
                    if (dist > 5) { dx = tdx / dist; dy = tdy / dist; }
                }
                player.move(dx, dy);

                fireMagicBullets(timestamp);
                fireSniperBullets(timestamp);
                fireBullets(timestamp);
                fireSpinBullets(timestamp);
                triggerLightning(timestamp);

                vortexStars.forEach((vs, index) => {
                    vs.update(delta, timestamp);
                    if (vs.elapsed >= vs.duration) vortexStars.splice(index, 1);
                });

                for (let i = bullets.length - 1; i >= 0; i--) {
                    const b = bullets[i];
                    b.update(delta);
                    if (b.x < 0 || b.x > GAME_WIDTH || b.y < 0 || b.y > GAME_HEIGHT || (b.isVortex && b.elapsed >= b.maxLifetime)) {
                        bullets.splice(i, 1);
                        bulletPool.release(b);
                    }
                }

                for (let i = lightningBeams.length - 1; i >= 0; i--) {
                    const beam = lightningBeams[i];
                    beam.update();
                    if (beam.x < 0 || beam.x > GAME_WIDTH || beam.y < 0 || beam.y > GAME_HEIGHT) {
                        lightningBeams.splice(i, 1);
                        lightningBeamPool.release(beam);
                        continue;
                    }
                    for (let j = 0; j < enemies.length; j++) {
                        const en = enemies[j];
                        if (beam.hitEnemies.has(en)) continue;
                        const dist = Math.hypot(beam.x - en.x, beam.y - en.y);
                        if (dist <= (beam.length / 2) + (en.size / 2)) {
                            beam.hitEnemies.add(en);
                            en.takeDamage(beam.damage);
                            audio.playHit();
                            if (!beam.isPiercing) {
                                lightningBeams.splice(i, 1);
                                lightningBeamPool.release(beam);
                                break;
                            }
                        }
                    }
                }

                for (let i = enemyBullets.length - 1; i >= 0; i--) {
                    const eb = enemyBullets[i];
                    eb.update();
                    if (eb.x < 0 || eb.x > GAME_WIDTH || eb.y < 0 || eb.y > GAME_HEIGHT) {
                        enemyBullets.splice(i, 1);
                        enemyBulletPool.release(eb);
                        continue;
                    }
                    const dist = Math.hypot(eb.x - player.x, eb.y - player.y);
                    if (dist < (eb.size / 2) + player.radius) {
                        player.takeDamage(eb.damage, timestamp);
                        audio.playHit();
                        enemyBullets.splice(i, 1);
                        enemyBulletPool.release(eb);
                    }
                }

                for (let i = explosions.length - 1; i >= 0; i--) {
                    const ex = explosions[i];
                    ex.update(delta);
                    enemies.forEach(en => {
                        const dist = Math.hypot(en.x - ex.x, en.y - ex.y);
                        if (dist <= ex.currentRadius + en.size / 2) en.takeDamage(ex.damage);
                    });
                    if (ex.elapsed >= ex.duration) {
                        explosions.splice(i, 1);
                        explosionPool.release(ex);
                    }
                }

                lightnings.forEach((l, index) => {
                    l.update(delta);
                    if (l.elapsed >= l.duration) lightnings.splice(index, 1);
                });

                for (let i = bullets.length - 1; i >= 0; i--) {
                    const b = bullets[i];
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        const en = enemies[j];
                        if (b.hitEnemies.has(en)) continue;

                        let isHit = false;
                        const dist = Math.hypot(b.x - en.x, b.y - en.y);
                        if (dist < en.size / 2 + (b.isVortex ? 6 : 8)) isHit = true;

                        if (isHit) {
                            b.hitEnemies.add(en);
                            en.takeDamage(b.damage);
                            audio.playHit();

                            if (b.isFireball) {
                                explosions.push(explosionPool.get(b.x, b.y, (b.fireballBaseDamage * player.damageMultiplier) / 2, b.explosionRadius));
                                audio.playExplosion();
                                bullets.splice(i, 1);
                                bulletPool.release(b);
                                break;
                            } else {
                                b.hits++;
                                if (b.hits >= b.penetration) {
                                    bullets.splice(i, 1);
                                    bulletPool.release(b);
                                    break;
                                }
                            }
                        }
                    }
                }

                for (let i = enemies.length - 1; i >= 0; i--) {
                    const en = enemies[i];
                    en.update(timestamp, delta);

                    if (Math.hypot(en.x - player.x, en.y - player.y) < en.size / 2 + player.radius) {
                        player.takeDamage(en.damage, timestamp);
                        audio.playHit();
                    }

                    if (en.hp <= 0) {
                        killsCount++;
                        updateHUD();
                        for (let p = 0; p < 5; p++) {
                            particles.push(particlePool.get(en.x, en.y, en.color));
                        }
                        gems.push(gemPool.get(en.x, en.y, en.xpValue, '#38bdf8'));
                        enemies.splice(i, 1);
                        enemyPool.release(en);
                    }
                }

                for (let i = gems.length - 1; i >= 0; i--) {
                    const g = gems[i];
                    const dist = Math.hypot(g.x - player.x, g.y - player.y);
                    if (g.isMagnetized || dist < 85) {
                        g.isMagnetized = true;
                        const angle = Math.atan2(player.y - g.y, player.x - g.x);
                        g.x += Math.cos(angle) * 15.0;
                        g.y += Math.sin(angle) * 15.0;
                        if (dist < player.radius + g.radius) {
                            player.addXp(g.value);
                            gems.splice(i, 1);
                            gemPool.release(g);
                        }
                    }
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    const pt = particles[i];
                    pt.update();
                    if (pt.life <= 0) {
                        particles.splice(i, 1);
                        particlePool.release(pt);
                    }
                }

                for (let i = floatingTexts.length - 1; i >= 0; i--) {
                    const ft = floatingTexts[i];
                    ft.update();
                    if (ft.life <= 0) {
                        floatingTexts.splice(i, 1);
                        floatingTextPool.release(ft);
                    }
                }
            }

            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            ctx.strokeStyle = '#1a1f35';
            ctx.lineWidth = 1;
            const gridSize = 60;
            ctx.beginPath();
            for (let x = 0; x < GAME_WIDTH; x += gridSize) { ctx.moveTo(x, 0); ctx.lineTo(x, GAME_HEIGHT); }
            for (let y = 0; y < GAME_HEIGHT; y += gridSize) { ctx.moveTo(0, y); ctx.lineTo(GAME_WIDTH, y); }
            ctx.stroke();

            particles.forEach(pt => pt.draw());
            gems.forEach(g => g.draw());
            specialItems.forEach(item => item.draw());
            enemies.forEach(en => en.draw());
            vortexStars.forEach(vs => vs.draw());
            bullets.forEach(b => b.draw());
            lightningBeams.forEach(beam => beam.draw());
            enemyBullets.forEach(eb => eb.draw());
            explosions.forEach(ex => ex.draw());
            lightnings.forEach(l => l.draw());
            floatingTexts.forEach(ft => ft.draw());
            player.draw();

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function gameOver(isVictory) {
            isGameRunning = false;
            cancelAnimationFrame(animationFrameId);
            hud.classList.add('hidden');
            upgradeModal.classList.add('hidden');
            menuModal.classList.add('hidden');

            gameoverTitle.innerText = isVictory ? "🏆 勝利！ (VICTORY)" : "💀 遊戲結束 (GAME OVER)";
            gameoverSubtitle.innerText = isVictory ? "恭喜你成功生存了 15 分鐘！" : "你被怪物擊敗了，再接再勵！";
            
            const totalSecs = Math.floor(gameTime / 1000);
            const mins = String(Math.floor(totalSecs / 60)).padStart(2, '0');
            const secs = String(totalSecs % 60).padStart(2, '0');
            goSummaryTime.innerText = `${mins}:${secs}`;
            goSummaryRawKills.innerText = killsCount;
            goSummaryMultiplier.innerText = `x1.0`;
            
            finalCalculatedScore = killsCount;
            goSummaryKills.innerText = `${finalCalculatedScore} 分`;
            goSummaryLevel.innerText = `LVL ${player ? player.level : 1}`;

            playerNameInput.value = '';
            scoreInputSection.classList.remove('hidden');
            leaderboardSection.classList.add('hidden');
            gameoverButtons.classList.remove('hidden');
            gameoverModal.classList.remove('hidden');
        }

        startBtn.onclick = startGame;
    </script>
</body>
</html>
